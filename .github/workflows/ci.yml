name: CI - Build y Push picopark-game

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias y verificar tests
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test && !p.scripts.test.includes('no test specified') ? 0 : 1)"; then
            npm test
          else
            echo "Sin tests configurados en package.json"
          fi

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y subir imagen a Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-game:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/picopark-game:sha-${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Desplegar en la VM
        run: |
          cd ~/Proyecto/picopark-game
          docker compose pull
          docker compose up -d
          docker compose ps
