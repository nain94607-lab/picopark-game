<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pico Park Host - Motor de Juego</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #18181c; color: white; text-align: center; margin: 0; padding: 10px; }
    #canvas-container { display: flex; justify-content: center; margin-top: 10px; }
    canvas { border: 4px solid #fff; border-radius: 6px; background: #222; }
    .status-bar { display: flex; justify-content: space-around; width: 800px; margin: 0 auto; background: #2a2a32; padding: 10px; border-radius: 6px; align-items: center; }
    .badge { padding: 5px 10px; border-radius: 4px; font-weight: bold; }
    
    /* ESTILOS PARA EL PANEL DE QR FLOTANTE */
    #qr-overlay {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(30, 30, 36, 0.95);
      border: 2px solid #3b82f6;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 1000;
      text-align: center;
    }
    #qrcode {
      background: white;
      padding: 10px;
      border-radius: 6px;
      display: inline-block;
      margin-top: 8px;
    }
    .ip-text {
      color: #38bdf8;
      font-weight: bold;
      font-size: 16px;
      margin-top: 5px;
    }

    /* ESTILO PARA EL AVISO DE PAUSA EN PANTALLA */
    #pauseOverlay {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      border: 3px solid #dc2626;
      padding: 30px 50px;
      border-radius: 12px;
      z-index: 2000;
      font-size: 32px;
      font-weight: bold;
      color: #fff;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.7);
    }
  </style>

  <!-- Motor Físico Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- Librería QRCode.js para generar el código QR en pantalla -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <h1>🎮 Pico Park - Host (Pantalla Principal)</h1>

  <!-- AVISO VISUAL DE PAUSA -->
  <div id="pauseOverlay">⏸ JUEGO PAUSADO</div>

  <!-- PANEL VISUAL DE CONEXIÓN (IP Y QR EN PANTALLA) -->
  <div id="qr-overlay">
    <div style="font-size: 14px; font-weight: bold; color: #fff;">📱 ESCANEA PARA UNIRTE</div>
    <div id="qrcode"></div>
    <div class="ip-text" id="lblIpAddress">Cargando IP...</div>
  </div>

  <div class="status-bar">
    <div>Nivel Actual: <span id="lblLevel" style="color:#00e676; font-weight:bold;">1</span></div>
    <div>Jugadores Conectados: <span id="lblPlayerCount">0</span> / 4</div>
    <div>Estado Llave: <span id="lblKeyStatus" style="color:#ffea00;">En el Mapa</span></div>
  </div>

  <div id="canvas-container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Mostrar automáticamente la IP y generar el QR con la dirección actual del host
    const currentHostUrl = window.location.href; // Ej: http://192.168.1.15:3000/
    document.getElementById('lblIpAddress').innerText = window.location.host;

    // Generar el código QR visualmente
    new QRCode(document.getElementById("qrcode"), {
      text: currentHostUrl,
      width: 128,
      height: 128,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });

    const { Engine, Render, Runner, Bodies, Body, Composite, Events, Vector } = Matter;

    // Configuración del Motor Físico
    const engine = Engine.create({ gravity: { x: 0, y: 1.5 } });
    const container = document.getElementById('canvas-container');

    const render = Render.create({
      element: container,
      engine: engine,
      options: { width: 800, height: 500, wireframes: false, background: '#1e1e24' }
    });

    Render.run(render);
    const runner = Runner.create({ fps: 30 });
    Runner.run(runner, engine);

    let level = 1;
    let playersBodies = {};
    let keyBody = null;
    let doorBody = null;
    let hasKey = false;
    let isPaused = false; // Variable global para controlar el estado de pausa

    function loadLevel(lvl) {
      level = lvl;
      document.getElementById('lblLevel').innerText = level;
      hasKey = false;
      document.getElementById('lblKeyStatus').innerText = "En el Mapa";

      Composite.clear(engine.world);

      const ground = Bodies.rectangle(400, 490, 800, 20, { isStatic: true, render: { fillStyle: '#4a4a5a' } });
      const leftWall = Bodies.rectangle(10, 250, 20, 500, { isStatic: true, render: { fillStyle: '#4a4a5a' } });
      const rightWall = Bodies.rectangle(790, 250, 20, 500, { isStatic: true, render: { fillStyle: '#4a4a5a' } });
      Composite.add(engine.world, [ground, leftWall, rightWall]);

      if (level === 1) {
        keyBody = Bodies.rectangle(400, 460, 20, 20, { isSensor: true, render: { fillStyle: '#ffea00' } });
      } else if (level === 2) {
        const platform = Bodies.rectangle(600, 220, 200, 20, { isStatic: true, render: { fillStyle: '#8b5cf6' } });
        Composite.add(engine.world, platform);
        keyBody = Bodies.rectangle(600, 190, 20, 20, { isSensor: true, render: { fillStyle: '#ffea00' } });
      }

      doorBody = Bodies.rectangle(740, 440, 40, 80, { isSensor: true, render: { fillStyle: '#3b82f6' } });
      Composite.add(engine.world, [keyBody, doorBody]);

      socket.emit('get_current_players');
    }

    Events.on(engine, 'collisionStart', (event) => {
      if (isPaused) return; // Si está pausado ignoramos colisiones
      event.pairs.forEach(pair => {
        const { bodyA, bodyB } = pair;
        if ((bodyA === keyBody || bodyB === keyBody) && !hasKey) {
          hasKey = true;
          document.getElementById('lblKeyStatus').innerText = "🔑 ¡Llave Obtenida!";
          Composite.remove(engine.world, keyBody);
        }
        if ((bodyA === doorBody || bodyB === doorBody) && hasKey) {
          checkWinCondition();
        }
      });
    });

    function checkWinCondition() {
      let countNearDoor = 0;
      const playerKeys = Object.keys(playersBodies);

      playerKeys.forEach(id => {
        const p = playersBodies[id];
        if (Math.abs(p.body.position.x - doorBody.position.x) < 50) {
          countNearDoor++;
        }
      });

      if (countNearDoor >= playerKeys.length && playerKeys.length > 0) {
        alert(`🎉 ¡Nivel ${level} Completado!`);
        const nextLevel = level === 1 ? 2 : 1;
        socket.emit('level_completed', nextLevel);
      }
    }

    socket.on('players_updated', (serverPlayers) => {
      document.getElementById('lblPlayerCount').innerText = Object.keys(serverPlayers).length;

      for (let id in serverPlayers) {
        if (!playersBodies[id]) {
          const sp = serverPlayers[id];
          const playerBody = Bodies.rectangle(100 + (sp.playerIndex * 40), 400, 30, 40, {
            inertia: Infinity,
            friction: 0.1,
            render: { fillStyle: sp.color }
          });
          Composite.add(engine.world, playerBody);
          playersBodies[id] = { body: playerBody, color: sp.color };
        }
      }

      for (let id in playersBodies) {
        if (!serverPlayers[id]) {
          Composite.remove(engine.world, playersBodies[id].body);
          delete playersBodies[id];
        }
      }
    });

    socket.on('host_process_input', (data) => {
      // Controlar la acción de pausa enviada desde el celular
      if (data.action === 'pause') {
        isPaused = !isPaused;
        const pauseBox = document.getElementById('pauseOverlay');
        if (pauseBox) {
          pauseBox.style.display = isPaused ? 'block' : 'none';
        }
        return;
      }

      // Si el juego está pausado, no se procesa ningún movimiento de controles
      if (isPaused) return;

      const p = playersBodies[data.socketId];
      if (!p) return;

      if (data.action === 'left') Body.setVelocity(p.body, { x: -4, y: p.body.velocity.y });
      if (data.action === 'right') Body.setVelocity(p.body, { x: 4, y: p.body.velocity.y });
      if (data.action === 'jump' && Math.abs(p.body.velocity.y) < 0.2) {
        Body.setVelocity(p.body, { x: p.body.velocity.x, y: -9 });
      }
    });

    socket.on('change_level', (newLevel) => {
      loadLevel(newLevel);
    });

    loadLevel(1);
  </script>
</body>
</html>
