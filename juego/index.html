<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pico Park - Juego</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #hud {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background-color: #1e293b;
      border-radius: 12px 12px 0 0;
      border: 2px solid #334155;
      border-bottom: none;
    }

    .hud-item {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 1px;
      color: #38bdf8;
    }

    #game-container {
      position: relative;
      width: 960px;
      height: 540px;
      background-color: #1e1e2e;
      border: 2px solid #334155;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    canvas {
      display: block;
      background-color: #181825;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      z-index: 10;
    }

    .title {
      font-size: 38px;
      font-weight: 900;
      color: #f43f5e;
      text-shadow: 2px 2px 0px #881337;
      letter-spacing: 2px;
    }

    .btn {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1d4ed8;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .levels-grid {
      display: flex;
      gap: 15px;
    }

    .btn-level {
      width: 65px;
      height: 65px;
      font-size: 22px;
      border-radius: 12px;
    }

    #qr-container {
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #qr-container img {
      width: 140px;
      height: 140px;
    }

    #qr-container span {
      color: #0f172a;
      font-weight: bold;
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }
  </style>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- HUD informativo superior -->
  <div id="hud">
    <div class="hud-item" id="hud-level">NIVEL: 1</div>
    <div class="hud-item" id="hud-status">ESPERANDO CELULAR...</div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>

    <!-- Menú Principal en la PC con QR y el botón JUGAR recuperado -->
    <div id="main-menu" class="overlay">
      <h1 class="title">PICO PARK</h1>
      <div id="qr-container">
        <img id="qr-img" src="" alt="Cargando QR...">
        <span id="ip-text">Cargando IP...</span>
      </div>
      <button class="btn" onclick="abrirNiveles()">JUGAR</button>
    </div>

    <!-- Selector de Niveles en la PC -->
    <div id="level-menu" class="overlay hidden">
      <h2 style="color: #38bdf8; font-size: 24px;">SELECCIONA EL NIVEL</h2>
      <div class="levels-grid">
        <button class="btn btn-level" onclick="iniciarNivelPC(1)">1</button>
        <button class="btn btn-level" onclick="iniciarNivelPC(2)">2</button>
        <button class="btn btn-level" onclick="iniciarNivelPC(3)">3</button>
      </div>
    </div>

    <!-- Pantalla de Victoria -->
    <div id="win-screen" class="overlay hidden">
      <h1 class="title" style="color: #22c55e; text-shadow: 2px 2px 0px #15803d;">¡NIVEL COMPLETADO!</h1>
      <p style="font-size: 18px; color: #94a3b8;">Usa tu celular para elegir el siguiente nivel o presiona MENÚ.</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const socket = io();

    fetch('/info-red')
      .then(res => res.json())
      .then(data => {
        document.getElementById('qr-img').src = data.qr;
        document.getElementById('ip-text').innerText = data.ip;
      });

    const WORLD = { width: 2800, height: 1200, gravity: 0.55 };
    const camera = { x: 0, y: 0, width: canvas.width, height: canvas.height };

    const player = {
      x: 100, y: 950, width: 40, height: 40,
      vx: 0, vy: 0, speed: 6, jumpPower: -13.5,
      grounded: false, color: '#f43f5e'
    };

    const keys = { left: false, right: false };

    const nivelesData = {
      1: {
        plataformas: [
          { x: 0, y: 1100, width: 2800, height: 100 },
          { x: 350, y: 950, width: 200, height: 25 },
          { x: 700, y: 820, width: 200, height: 25 },
          { x: 1050, y: 690, width: 200, height: 25 },
          { x: 1400, y: 560, width: 250, height: 25 },
          { x: 1800, y: 440, width: 200, height: 25 },
        ],
        meta: { x: 2250, y: 1000, width: 60, height: 100 }
      },
      2: {
        plataformas: [
          { x: 0, y: 1100, width: 2800, height: 100 },
          { x: 250, y: 980, width: 150, height: 25 },
          { x: 500, y: 860, width: 150, height: 25 },
          { x: 750, y: 740, width: 150, height: 25 },
          { x: 1000, y: 620, width: 150, height: 25 },
          { x: 1300, y: 500, width: 180, height: 25 },
          { x: 1650, y: 380, width: 200, height: 25 },
          { x: 2000, y: 280, width: 180, height: 25 }
        ],
        meta: { x: 2400, y: 1000, width: 60, height: 100 }
      },
      3: {
        plataformas: [
          { x: 0, y: 1100, width: 2800, height: 100 },
          { x: 300, y: 920, width: 120, height: 25 },
          { x: 550, y: 780, width: 120, height: 25 },
          { x: 800, y: 640, width: 120, height: 25 },
          { x: 1100, y: 520, width: 150, height: 25 },
          { x: 1450, y: 400, width: 150, height: 25 },
          { x: 1850, y: 300, width: 200, height: 25 }
        ],
        meta: { x: 2350, y: 1000, width: 60, height: 100 }
      }
    };

    let nivelActual = 1;
    let juegoGanado = false;

    socket.on('accion', (data) => {
      const isPress = data.estado === 'PRESS';
      if (data.tipo === 'IZQUIERDA') keys.left = isPress;
      if (data.tipo === 'DERECHA') keys.right = isPress;
      if (data.tipo === 'SALTAR') {
        if (isPress && player.grounded) {
          player.vy = player.jumpPower;
          player.grounded = false;
        }
      }
    });

    function update() {
      if (juegoGanado) return;

      player.vx = 0;
      if (keys.left) player.vx = -player.speed;
      if (keys.right) player.vx = player.speed;

      player.x += player.vx;
      let plats = nivelesData[nivelActual].plataformas;
      for (let plat of plats) {
        if (checkCollision(player, plat)) {
          if (player.vx > 0) player.x = plat.x - player.width;
          else if (player.vx < 0) player.x = plat.x + plat.width;
        }
      }

      player.vy += WORLD.gravity;
      player.y += player.vy;
      player.grounded = false;

      for (let plat of plats) {
        if (checkCollision(player, plat)) {
          if (player.vy > 0) {
            player.y = plat.y - player.height;
            player.vy = 0;
            player.grounded = true;
          } else if (player.vy < 0) {
            player.y = plat.y + plat.height;
            player.vy = 0;
          }
        }
      }

      let meta = nivelesData[nivelActual].meta;
      if (checkCollision(player, meta)) {
        juegoGanado = true;
        document.getElementById('win-screen').classList.remove('hidden');
      }

      if (player.x < 0) player.x = 0;
      if (player.x + player.width > WORLD.width) player.x = WORLD.width - player.width;
      if (player.y > WORLD.height) {
        player.x = 100;
        player.y = 950;
        player.vy = 0;
      }

      camera.x = player.x - camera.width / 2 + player.width / 2;
      camera.y = player.y - camera.height / 2 + player.height / 2;
      camera.x = Math.max(0, Math.min(camera.x, WORLD.width - camera.width));
      camera.y = Math.max(0, Math.min(camera.y, WORLD.height - camera.height));
    }

    function checkCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(-camera.x, -camera.y);

      ctx.strokeStyle = '#27273a';
      ctx.lineWidth = 1;
      for (let x = 0; x < WORLD.width; x += 60) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height); ctx.stroke();
      }
      for (let y = 0; y < WORLD.height; y += 60) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y); ctx.stroke();
      }

      ctx.fillStyle = '#38bdf8';
      for (let plat of nivelesData[nivelActual].plataformas) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      }

      let meta = nivelesData[nivelActual].meta;
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(meta.x, meta.y, meta.width, meta.height);

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.restore();
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    // Funciones locales de la PC para abrir el menú de niveles al presionar "JUGAR"
    function abrirNiveles() {
      document.getElementById('main-menu').classList.add('hidden');
      document.getElementById('win-screen').classList.add('hidden');
      document.getElementById('level-menu').classList.remove('hidden');
    }

    function iniciarNivelPC(num) {
      nivelActual = num;
      juegoGanado = false;
      document.getElementById('main-menu').classList.add('hidden');
      document.getElementById('win-screen').classList.add('hidden');
      document.getElementById('level-menu').classList.add('hidden');
      document.getElementById('hud-level').innerText = `NIVEL: ${num}`;
      document.getElementById('hud-status').innerText = '¡JUGANDO!';
      
      player.x = 100;
      player.y = 950;
      player.vx = 0;
      player.vy = 0;
    }

    // Órdenes que vienen del celular
    socket.on('cambiar_nivel', (num) => {
      iniciarNivelPC(num);
    });

    socket.on('abrir_menu', () => {
      document.getElementById('level-menu').classList.add('hidden');
      document.getElementById('win-screen').classList.add('hidden');
      document.getElementById('main-menu').classList.remove('hidden');
      document.getElementById('hud-status').innerText = 'EN MENÚ';
    });

    socket.on('connect', () => {
      document.getElementById('hud-status').innerText = '¡CONTROL CONECTADO!';
    });

    gameLoop();
  </script>
</body>
</html>
